apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalog

labels:
  - pairs:
      app.kubernetes.io/part-of: catalog
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml

# CI (or a GitOps image updater) sets this to the immutable tag it pushed:
#   kustomize edit set image catalog-api=<acct>.dkr.ecr.<region>.amazonaws.com/catalog-api:sha-<commit>
images:
  - name: catalog-api
    newName: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/catalog-api
    newTag: sha-0000000
