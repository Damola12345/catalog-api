version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - revive
  exclusions:
    presets:
      - std-error-handling # e.g. unchecked `defer res.Body.Close()`
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
