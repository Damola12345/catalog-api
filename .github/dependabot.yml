# Keeps base images, actions and Go deps patched — the cheapest way to keep
# the Trivy gate green over time.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /terraform/live
    schedule: { interval: monthly }
